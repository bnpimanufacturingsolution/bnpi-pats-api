openapi: 3.1.0
info:
  title: BNPI PMS API
  version: 1.0.0
  description: Welcome to the BNPI PMS API documentation. This REST API powers
    BNPI PMS backend services.
  contact:
    name: BNPI PMS Support
    email: support@bnpi-pms.example
    url: https://bnpi-pms.example/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://bnpi-pms.example/terms
servers:
  - url: /api
    description: Development server
  - url: https://api.bnpi-pms.example/api
    description: Production server
tags:
  - name: Template
    description: Template management operations
    externalDocs:
      description: Find out more about templates
      url: https://bnpi-pms.example/docs/templates
  - name: Documentation
    description: API documentation endpoints
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme. Example:
        'Authorization: Bearer {token}'"
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for authentication
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the user
        email:
          type: string
          description: The email address of the user
        password:
          type: string
          description: The hashed password of the user
        firstName:
          type: string
          description: The first name of the user
        lastName:
          type: string
          description: The last name of the user
        role:
          type: string
          enum:
            - ADMIN
            - USER
          description: The role of the user
      required:
        - email
        - password
        - firstName
        - lastName
        - role
paths:
  security:
    "0":
      bearerAuth: []
  /api/docs/api-list:
    get:
      summary: Get API endpoints list
      description: Get a list of all API endpoints in various formats
      tags:
        - Documentation
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - text
          description: Output format (default json)
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by tag (case-insensitive)
        - in: query
          name: method
          schema:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
          description: Filter by HTTP method
      responses:
        "200":
          description: API endpoints list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      endpoints:
                        type: array
                        items:
                          type: object
                      total:
                        type: integer
                      filters:
                        type: object
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid format or validation error
        "404":
          description: Endpoints file not found
  /api/docs/swagger:
    get:
      summary: Get Swagger documentation
      description: Get the complete Swagger/OpenAPI specification
      tags:
        - Documentation
      responses:
        "200":
          description: Swagger documentation retrieved successfully
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Swagger file not found
  /api/docs/postman:
    get:
      summary: Get Postman collection
      description: Get the Postman collection for API testing
      tags:
        - Documentation
      responses:
        "200":
          description: Postman collection retrieved successfully
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Postman collection not found
  /api/docs/iml:
    get:
      summary: Generate iml files
      description: Generate iml files them to docs/generated/endpoints/ directory
      tags:
        - Documentation
      parameters:
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by specific tag (e.g., "template", "docs", "api")
        - in: query
          name: includeContent
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "true"
          description: Whether to include file contents in response or just file names
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - xml
            default: json
          description: Output format (json or xml)
      responses:
        "200":
          description: iml files generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tagFiles:
                        type: object
                        description: Object containing tag names as keys and iml arrays as values
                      availableTagFiles:
                        type: array
                        items:
                          type: string
                        description: Available tag file names (when includeContent=false)
            application/xml:
              schema:
                type: string
                description: XML representation of the iml data
        "500":
          description: Internal server error
  /api/estimation/{id}:
    get:
      summary: Get estimation by ID
      description: Retrieve a specific estimation by its unique identifier with
        optional field selection
      tags:
        - Estimation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Estimation ID (MongoDB ObjectId format)
          example: 507f1f77bcf86cd799439011
        - in: query
          name: fields
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to include (supports nested fields)
          example: id,estimationNumber,estimatedCost,status,projectItems(itemName,estimatedTotal)
      responses:
        "200":
          description: Estimation retrieved successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Estimation not found
        "500":
          description: Internal server error
    patch:
      summary: Update estimation
      description: Update estimation data by ID (partial update)
      tags:
        - Estimation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Estimation ID
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                estimatedCost:
                  type: number
                actualCost:
                  type: number
                  nullable: true
                marginPercentage:
                  type: number
                marginAmount:
                  type: number
                projectedWithMargin:
                  type: number
                status:
                  type: string
                  enum:
                    - DRAFT
                    - PENDING
                    - APPROVED
                    - REJECTED
                    - REVISED
                notes:
                  type: string
                  nullable: true
      responses:
        "200":
          description: Estimation updated successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Estimation not found
        "500":
          description: Internal server error
    delete:
      summary: Delete estimation
      description: Permanently delete an estimation by ID
      tags:
        - Estimation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Estimation ID
          example: 507f1f77bcf86cd799439011
      responses:
        "200":
          description: Estimation deleted successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Estimation not found
        "500":
          description: Internal server error
  /api/estimation:
    get:
      summary: Get all estimations
      description: Retrieve estimations with advanced filtering, pagination, sorting,
        field selection, and optional grouping
      tags:
        - Estimation
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of records per page
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort order
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by
          example: createdAt
        - in: query
          name: fields
          schema:
            type: string
          description: Comma-separated list of fields to include
          example: id,estimationNumber,status,estimatedCost
        - in: query
          name: query
          schema:
            type: string
          description: Search query
          example: EST-2025
        - in: query
          name: filter
          schema:
            type: string
          description: JSON array of filter objects
          example: '[{"status":"APPROVED"}]'
        - in: query
          name: groupBy
          schema:
            type: string
          description: Group results by field
          example: status
        - in: query
          name: document
          schema:
            type: string
            enum:
              - "true"
          description: Include estimation documents
        - in: query
          name: pagination
          schema:
            type: string
            enum:
              - "true"
          description: Include pagination metadata
        - in: query
          name: count
          schema:
            type: string
            enum:
              - "true"
          description: Include total count
      responses:
        "200":
          description: Estimations retrieved successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
    post:
      summary: Create new estimation
      description: Create a new estimation with the provided data
      tags:
        - Estimation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - estimationNumber
                - projectId
                - estimatedCost
                - marginPercentage
                - marginAmount
                - projectedWithMargin
              properties:
                estimationNumber:
                  type: string
                  example: EST-2025-001
                projectId:
                  type: string
                  example: 507f1f77bcf86cd799439011
                estimatedCost:
                  type: number
                  example: 100000
                actualCost:
                  type: number
                  nullable: true
                  example: 95000
                marginPercentage:
                  type: number
                  example: 30
                marginAmount:
                  type: number
                  example: 30000
                projectedWithMargin:
                  type: number
                  example: 130000
                status:
                  type: string
                  enum:
                    - DRAFT
                    - PENDING
                    - APPROVED
                    - REJECTED
                    - REVISED
                  default: DRAFT
                notes:
                  type: string
                  nullable: true
      responses:
        "201":
          description: Estimation created successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Project not found
        "500":
          description: Internal server error
  /api/estimation/{id}/approve:
    post:
      summary: Approve estimation
      description: Approve an estimation and mark it as approved
      tags:
        - Estimation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Estimation ID
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approvedBy
              properties:
                approvedBy:
                  type: string
                  description: User ID who approved
                  example: user_001
                notes:
                  type: string
                  description: Optional approval notes
      responses:
        "200":
          description: Estimation approved successfully
        "400":
          description: Bad request or already approved
        "401":
          description: Unauthorized
        "404":
          description: Estimation not found
        "500":
          description: Internal server error
  /api/estimation/{id}/reject:
    post:
      summary: Reject estimation
      description: Reject an estimation with a reason
      tags:
        - Estimation
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Estimation ID
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - notes
              properties:
                notes:
                  type: string
                  description: Rejection reason (required)
                  example: Budget exceeds project limits
      responses:
        "200":
          description: Estimation rejected successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Estimation not found
        "500":
          description: Internal server error
  /api/estimationItem/{id}:
    get:
      summary: Get estimationItem by ID
      description: Retrieve a specific estimationItem by its unique identifier with
        optional field selection
      tags:
        - EstimationItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: EstimationItem ID (MongoDB ObjectId format)
        - in: query
          name: fields
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to include
      responses:
        "200":
          description: EstimationItem retrieved successfully
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update estimationItem
      description: Update estimationItem data by ID
      tags:
        - EstimationItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EstimationItem updated successfully
    delete:
      summary: Delete estimationItem
      description: Permanently delete a estimationItem by ID
      tags:
        - EstimationItem
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: EstimationItem deleted successfully
  /api/estimationItem:
    get:
      summary: Get all estimationItems
      description: Retrieve estimationItems with filtering, pagination, and grouping
      tags:
        - EstimationItem
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
        - in: query
          name: type
          schema:
            type: string
            enum:
              - CAPEX
              - OPEX
          description: Filter by item type
        - in: query
          name: document
          schema:
            type: string
            enum:
              - "true"
          description: Include estimationItem documents in response
        - in: query
          name: pagination
          schema:
            type: string
            enum:
              - "true"
          description: Include pagination metadata
        - in: query
          name: count
          schema:
            type: string
            enum:
              - "true"
          description: Include total count
      responses:
        "200":
          description: EstimationItems retrieved successfully
    post:
      summary: Create new estimationItem
      description: Create a new estimationItem (CAPEX or OPEX)
      tags:
        - EstimationItem
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - projectId
                - type
                - itemName
                - quantity
                - estimatedUnitPrice
                - estimatedTotal
              properties:
                projectId:
                  type: string
                type:
                  type: string
                  enum:
                    - CAPEX
                    - OPEX
                category:
                  type: string
                  description: Category (mainly for OPEX items)
                itemName:
                  type: string
                quantity:
                  type: integer
                estimatedUnitPrice:
                  type: number
                estimatedTotal:
                  type: number
      responses:
        "201":
          description: EstimationItem created successfully
  /api/sequential/{id}:
    get:
      summary: Get sequential by ID
      description: Retrieve a specific sequential by its unique identifier with
        optional field selection
      tags:
        - Sequential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Sequential ID (MongoDB ObjectId format)
          example: 507f1f77bcf86cd799439011
        - in: query
          name: fields
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to include
          example: id,name,code,pattern,current
      responses:
        "200":
          description: Sequential retrieved successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Sequential not found
        "500":
          description: Internal server error
    patch:
      summary: Update sequential
      description: Update sequential data by ID (partial update)
      tags:
        - Sequential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Sequential ID
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                code:
                  type: string
                pattern:
                  type: string
                current:
                  type: integer
      responses:
        "200":
          description: Sequential updated successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Sequential not found
        "409":
          description: Sequential with this name or code already exists
        "500":
          description: Internal server error
    delete:
      summary: Delete sequential
      description: Soft delete an sequential by ID
      tags:
        - Sequential
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Sequential ID
          example: 507f1f77bcf86cd799439011
      responses:
        "200":
          description: Sequential deleted successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "404":
          description: Sequential not found
        "500":
          description: Internal server error
  /api/sequential:
    get:
      summary: Get all sequentials
      description: Retrieve sequentials with advanced filtering, pagination, sorting,
        field selection, and optional grouping
      tags:
        - Sequential
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Page number for pagination
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Number of records per page
        - in: query
          name: order
          schema:
            type: string
            enum:
              - asc
              - desc
            default: desc
          description: Sort order
        - in: query
          name: sort
          schema:
            type: string
          description: Field to sort by
          example: createdAt
        - in: query
          name: fields
          schema:
            type: string
          description: Comma-separated list of fields to include
          example: id,name,code,pattern,current
        - in: query
          name: query
          schema:
            type: string
          description: Search query
          example: INV
        - in: query
          name: filter
          schema:
            type: string
          description: JSON array of filter objects
          example: '[{"code":"INV"}]'
        - in: query
          name: groupBy
          schema:
            type: string
          description: Group results by field
          example: code
        - in: query
          name: document
          schema:
            type: string
            enum:
              - "true"
          description: Include sequential documents
        - in: query
          name: pagination
          schema:
            type: string
            enum:
              - "true"
          description: Include pagination metadata
        - in: query
          name: count
          schema:
            type: string
            enum:
              - "true"
          description: Include total count
      responses:
        "200":
          description: Sequentials retrieved successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "500":
          description: Internal server error
    post:
      summary: Create new sequential
      description: Create a new sequential with the provided data
      tags:
        - Sequential
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - code
                - pattern
              properties:
                name:
                  type: string
                  example: Invoice Number
                code:
                  type: string
                  example: INV
                pattern:
                  type: string
                  example: INV-{YYYY}-{0000}
                current:
                  type: integer
                  default: 0
                  example: 0
      responses:
        "201":
          description: Sequential created successfully
        "400":
          description: Bad request
        "401":
          description: Unauthorized
        "409":
          description: Sequential with this name or code already exists
        "500":
          description: Internal server error
  /api/order/{id}:
    get:
      summary: Get order by ID
      description: Retrieve a specific order by its unique identifier with optional
        field selection
      tags:
        - Order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Order ID (MongoDB ObjectId format)
          example: 507f1f77bcf86cd799439011
        - in: query
          name: fields
          required: false
          schema:
            type: string
          description: Comma-separated list of fields to include (supports nested fields
            with dot notation)
          example: id,name,description,type
      responses:
        "200":
          description: Order retrieved successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    patch:
      summary: Update order
      description: Update order data by ID (partial update)
      tags:
        - Order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Order ID (MongoDB ObjectId format)
          example: 507f1f77bcf86cd799439011
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                name:
                  type: string
                  minLength: 1
                  description: Order name
                  example: Updated Email Order
                description:
                  type: string
                  description: Order description
                  example: Updated description for the order
                type:
                  type: string
                  enum:
                    - email
                    - sms
                    - push
                    - form
                  description: Order type for categorization
                  example: email
                isDeleted:
                  type: boolean
                  description: Soft delete flag
                  example: false
      responses:
        "200":
          description: Order updated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Success"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          order:
                            $ref: "#/components/schemas/Order"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"
    delete:
      summary: Delete order
      description: Permanently delete a order by ID
      tags:
        - Order
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Order ID (MongoDB ObjectId format)
