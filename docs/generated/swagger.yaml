openapi: 3.1.0
info:
  title: Bandai PATS API
  version: 1.0.0
  description: Welcome to the Bandai PATS API documentation. This REST API powers
    Bandai PATS backend services.
  contact:
    name: Bandai PATS Support
    email: support@bandai-pats.example
    url: https://bandai-pats.example/support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: https://bandai-pats.example/terms
servers:
  - url: /api
    description: Development server
  - url: https://api.bandai-pats.example/api
    description: Production server
tags:
  - name: Documentation
    description: API documentation endpoints
  - name: Employee
    description: Employee management with third-party API sync and database fallback
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: "JWT Authorization header using the Bearer scheme. Example:
        'Authorization: Bearer {token}'"
    apiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key for authentication
  schemas:
    User:
      type: object
      properties:
        id:
          type: string
          description: The unique identifier of the user
        email:
          type: string
          description: The email address of the user
        password:
          type: string
          description: The hashed password of the user
        firstName:
          type: string
          description: The first name of the user
        lastName:
          type: string
          description: The last name of the user
        role:
          type: string
          enum:
            - ADMIN
            - USER
          description: The role of the user
      required:
        - email
        - password
        - firstName
        - lastName
        - role
paths:
  security:
    "0":
      bearerAuth: []
  /api/docs/api-list:
    get:
      summary: Get API endpoints list
      description: Get a list of all API endpoints in various formats
      tags:
        - Documentation
      parameters:
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - text
          description: Output format (default json)
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by tag (case-insensitive)
        - in: query
          name: method
          schema:
            type: string
            enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
          description: Filter by HTTP method
      responses:
        "200":
          description: API endpoints list retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      endpoints:
                        type: array
                        items:
                          type: object
                      total:
                        type: integer
                      filters:
                        type: object
            text/plain:
              schema:
                type: string
        "400":
          description: Invalid format or validation error
        "404":
          description: Endpoints file not found
  /api/docs/swagger:
    get:
      summary: Get Swagger documentation
      description: Get the complete Swagger/OpenAPI specification
      tags:
        - Documentation
      responses:
        "200":
          description: Swagger documentation retrieved successfully
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Swagger file not found
  /api/docs/postman:
    get:
      summary: Get Postman collection
      description: Get the Postman collection for API testing
      tags:
        - Documentation
      responses:
        "200":
          description: Postman collection retrieved successfully
          content:
            application/json:
              schema:
                type: object
        "404":
          description: Postman collection not found
  /api/docs/iml:
    get:
      summary: Generate iml files
      description: Generate iml files them to docs/generated/endpoints/ directory
      tags:
        - Documentation
      parameters:
        - in: query
          name: tag
          schema:
            type: string
          description: Filter by specific tag (e.g., "template", "docs", "api")
        - in: query
          name: includeContent
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "true"
          description: Whether to include file contents in response or just file names
        - in: query
          name: format
          schema:
            type: string
            enum:
              - json
              - xml
            default: json
          description: Output format (json or xml)
      responses:
        "200":
          description: iml files generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  data:
                    type: object
                    properties:
                      tagFiles:
                        type: object
                        description: Object containing tag names as keys and iml arrays as values
                      availableTagFiles:
                        type: array
                        items:
                          type: string
                        description: Available tag file names (when includeContent=false)
            application/xml:
              schema:
                type: string
                description: XML representation of the iml data
        "500":
          description: Internal server error
  /api/workspace/check-code/{code}:
    get:
      summary: Check if workspace code is available
      description: Check if a workspace code already exists in the system
      tags:
        - Workspace
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: code
          required: true
          schema:
            type: string
          description: Workspace code to check
      responses:
        "200":
          description: Code availability status
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  available:
                    type: boolean
  /api/workspace/{id}:
    get:
      summary: Get workspace by ID
      description: Retrieve a specific workspace by its unique identifier
      tags:
        - Workspace
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Workspace ID (MongoDB ObjectId format)
      responses:
        "200":
          description: Workspace retrieved successfully
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      summary: Update workspace
      description: Update workspace data by ID
      tags:
        - Workspace
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace updated successfully
    delete:
      summary: Delete workspace
      description: Delete a workspace by ID
      tags:
        - Workspace
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspace deleted successfully
  /api/workspace:
    get:
      summary: Get all workspaces
      description: Retrieve workspaces with filtering, pagination, and sorting
      tags:
        - Workspace
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Workspaces retrieved successfully
    post:
      summary: Create new workspace
      description: Create a new workspace
      tags:
        - Workspace
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Workspace created successfully
  /api/workspace-member/me:
    get:
      summary: Get current user's workspace membership
      tags:
        - WorkspaceMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Membership retrieved successfully
        "404":
          description: Not a member of this workspace
  /api/workspace-member/{id}:
    get:
      summary: Get workspace member by ID
      tags:
        - WorkspaceMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member retrieved successfully
    delete:
      summary: Remove workspace member
      tags:
        - WorkspaceMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member removed successfully
  /api/workspace-member:
    get:
      summary: Get all workspace members
      tags:
        - WorkspaceMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members retrieved successfully
    post:
      summary: Add a member to workspace
      tags:
        - WorkspaceMember
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Member added successfully
  /api/workspace-member/{id}/role:
    patch:
      summary: Update workspace member role
      tags:
        - WorkspaceMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role updated successfully
  /api/project-member/project/{projectId}/me:
    get:
      summary: Get current user's role in a project
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project role retrieved successfully
  /api/project-member/project/{projectId}:
    get:
      summary: Get all members of a project
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project members retrieved successfully
  /api/project-member/{id}:
    get:
      summary: Get project member by ID
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Member retrieved successfully
    delete:
      summary: Remove project member
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Member removed successfully
  /api/project-member:
    get:
      summary: Get all project members in workspace
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Members retrieved successfully
    post:
      summary: Add a member to a project
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      responses:
        "201":
          description: Member added successfully
  /api/project-member/{id}/role:
    patch:
      summary: Update project member role
      tags:
        - ProjectMember
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Role updated successfully
  /api/employee:
    get:
      tags:
        - Employee
      summary: Get all employees
      description: |
        Retrieves employees. If syncConfig is provided, attempts to sync from
        third-party API first, falling back to database on failure.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
          description: Page number
        - in: query
          name: limit
          schema:
            type: integer
          description: Items per page
        - in: query
          name: search
          schema:
            type: string
          description: Search term
        - in: query
          name: status
          schema:
            type: string
            enum:
              - ACTIVE
              - INACTIVE
              - ON_LEAVE
              - TERMINATED
              - SUSPENDED
          description: Filter by status
        - in: query
          name: department
          schema:
            type: string
          description: Filter by department
        - in: query
          name: forceDatabase
          schema:
            type: boolean
          description: Skip API sync and use database only
      responses:
        "200":
          description: List of employees
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalServerError"
    post:
      tags:
        - Employee
      summary: Create a new employee manually
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - employeeNumber
                - firstName
                - lastName
                - email
              properties:
                employeeNumber:
                  type: string
                  example: EMP-001
                firstName:
                  type: string
                  example: John
                middleName:
                  type: string
                lastName:
                  type: string
                  example: Doe
                email:
                  type: string
                  format: email
                  example: john.doe@company.com
                phone:
                  type: string
                department:
                  type: string
                position:
                  type: string
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - INACTIVE
                    - ON_LEAVE
                    - TERMINATED
                    - SUSPENDED
                  default: ACTIVE
      responses:
        "201":
          description: Employee created
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: Duplicate email or employee number
  /api/employee/stats:
    get:
      tags:
        - Employee
      summary: Get employee statistics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Employee statistics by status, department, and sync status
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/employee/sync:
    post:
      tags:
        - Employee
      summary: Trigger employee sync from external API
      description: >
        Syncs employees from a third-party API. Falls back to database if API
        fails.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - apiUrl
              properties:
                apiUrl:
                  type: string
                  description: Third-party API URL
                  example: https://api.hris-system.com/employees
                authType:
                  type: string
                  enum:
                    - bearer
                    - api-key
                    - basic
                    - none
                  default: bearer
                authToken:
                  type: string
                  description: Authentication token
                apiKey:
                  type: string
                  description: API key (for api-key auth)
                headers:
                  type: object
                  description: Additional headers
                timeout:
                  type: integer
                  default: 30000
                retryAttempts:
                  type: integer
                  default: 3
                fieldMapping:
                  type: object
                  description: Custom field mapping from external to internal names
      responses:
        "200":
          description: Sync result with statistics
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/employee/sync/status:
    get:
      tags:
        - Employee
      summary: Get sync status and health
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sync status including any issues
  /api/employee/sync/issues:
    get:
      tags:
        - Employee
      summary: Get employees with sync issues
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of employees with FAILED or PENDING sync status
  /api/employee/external/{externalId}:
    get:
      tags:
        - Employee
      summary: Get employee by external ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: externalId
          required: true
          schema:
            type: string
        - in: query
          name: externalSource
          schema:
            type: string
          description: Filter by external source
      responses:
        "200":
          description: Employee details
        "404":
          $ref: "#/components/responses/NotFound"
  /api/employee/{id}:
    get:
      tags:
        - Employee
      summary: Get employee by ID
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
          description: Employee ID (MongoDB ObjectId)
      responses:
        "200":
          description: Employee details
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags:
        - Employee
      summary: Update employee
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: Employee updated
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags:
        - Employee
      summary: Delete employee (soft delete)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Employee deleted
        "404":
          $ref: "#/components/responses/NotFound"
  /api/product/generate-code:
    get:
      summary: Generate product code
      description: Generate the next available product code within the current workspace
      tags:
        - Product
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Product code generated successfully
  /api/product/{id}:
    get:
      summary: Get product by ID
      description: Retrieve a product and its production, BOM, and cost assumption data
      tags:
        - Product
      security:
        - bearerAuth: []
    patch:
      summary: Update product
      description: Update a product master record by ID
      tags:
        - Product
      security:
        - bearerAuth: []
    delete:
      summary: Delete product
      description: Soft delete a product by ID
      tags:
        - Product
      security:
        - bearerAuth: []
  /api/product:
    get:
      summary: Get all products
      description: Retrieve products with filtering, searching, sorting, and pagination
      tags:
        - Product
      security:
        - bearerAuth: []
    post:
      summary: Create new product
      description: Create a new product master record
      tags:
        - Product
      security:
        - bearerAuth: []
  /api/pats/catalog/products/{productId}:
    get:
      summary: Read a workspace-scoped PATS product catalog record
      description: Returns Product -> Model -> ModelPart data without legacy seed
        fallback. Optional private imageObjectKey metadata is resolved to a
        short-lived read URL and is never returned.
      tags:
        - PATS Catalog
      security:
        - bearerAuth: []
      parameters:
        - in: header
          name: x-workspace-id
          required: true
          schema:
            type: string
            pattern: ^[0-9a-fA-F]{24}$
        - in: path
          name: productId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Complete or sparse PATS catalog record
        "400":
          description: Workspace header is missing or invalid
        "404":
          description: Product is not linked to the requested workspace
        "503":
          description: Private image storage is unavailable
