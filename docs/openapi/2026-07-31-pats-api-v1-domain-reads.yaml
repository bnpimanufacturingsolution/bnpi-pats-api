openapi: 3.1.0
info:
  title: Bandai PATS API v1 Operational Read Contracts
  version: 2026-07-31
  description: Server-owned read resources for configuration, planning, execution, quality, dashboard, and line reporting.
servers:
  - url: /api/v1
paths:
  /workflow-groups:
    get:
      operationId: workflowGroupCollectionGet
      summary: Read deployment-owned workflow groups
      tags: [PATS Configuration]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /stages:
    get:
      operationId: stageCollectionGet
      summary: Read configured production stages
      tags: [PATS Configuration]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /sub-stages:
    get:
      operationId: subStageCollectionGet
      summary: Read configured production substages
      tags: [PATS Configuration]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /stations:
    get:
      operationId: stationCollectionGet
      summary: Read physical production stations
      tags: [PATS Configuration]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /stations/{stationId}/history:
    get:
      operationId: stationHistoryGet
      summary: Read server-owned station event history and open violations
      description: Returns stage-event evidence and open routing violations for the station's configured stage boundaries. The projection is read-only and rebuildable from the execution ledger.
      tags: [PATS Execution]
      x-required-capability: execution.read
      parameters:
        - name: stationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
      responses: { '200': { $ref: '#/components/responses/StationHistoryRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /stations/{stationId}/support:
    get:
      operationId: stationSupportGet
      summary: Read rebuildable station support projection (output + WIP)
      description: >
        Secondary workstation cards. todayOutput aggregates first-success PrintJobs (SENT|SIMULATED,
        sequence 1) at this station for a UTC calendar day (query date=YYYY-MM-DD). materials are
        hop inventory (bound-step positions minus first-success print here). lotPlans carry
        ceil(lot.requiredProductionQuantity / lot.labelPackSize) for Lot Progress — the
        denominator is the lot plan, not hop occupancy. staff and expectedOutput stay null until
        product-owned sources exist.
      tags: [PATS Execution]
      x-required-capability: execution.read
      parameters:
        - name: stationId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: date
          in: query
          required: false
          schema: { type: string, format: date }
          description: UTC calendar day for today's output (default current UTC date)
      responses: { '200': { $ref: '#/components/responses/ResourceRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /station-steps:
    get:
      operationId: stationStepCollectionGet
      summary: Read station-to-stage bindings
      tags: [PATS Configuration]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /work-instructions:
    get:
      operationId: workInstructionCollectionGet
      summary: Read versioned work instructions
      tags: [PATS Configuration]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /production-plans:
    get:
      operationId: productionPlanCollectionGet
      summary: List production-plan summaries
      tags: [PATS Planning]
      x-required-capability: planning.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
      responses: { '200': { $ref: '#/components/responses/PaginatedRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /production-plans/{planId}:
    get:
      operationId: productionPlanGet
      summary: Read a production plan and its planning snapshot
      tags: [PATS Planning]
      x-required-capability: planning.read
      parameters: [{ $ref: '#/components/parameters/PlanId' }]
      responses: { '200': { $ref: '#/components/responses/ResourceRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /batches:
    get:
      operationId: batchCollectionGet
      summary: List batches and their current positions
      tags: [PATS Execution]
      x-required-capability: execution.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BatchId'
      responses: { '200': { $ref: '#/components/responses/PaginatedRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /batch-positions:
    get:
      operationId: batchPositionCollectionGet
      summary: Read rebuildable station-ready batch-position projections
      description: Returns current positions together with batch, lot, part, and ordered route-step identity needed by execution workstations. The projection is rebuildable from the execution ledger and is not a second source of truth.
      tags: [PATS Execution]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /stage-events:
    get:
      operationId: stageEventCollectionGet
      summary: Read append-only stage execution evidence
      tags: [PATS Execution]
      x-required-capability: execution.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BatchId'
      responses: { '200': { $ref: '#/components/responses/PaginatedRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /inventory-transactions:
    get:
      operationId: inventoryTransactionCollectionGet
      summary: Read append-only inventory evidence
      tags: [PATS Inventory]
      x-required-capability: inventory.read
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/BatchId'
      responses: { '200': { $ref: '#/components/responses/PaginatedRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /routing-violations:
    get:
      operationId: routingViolationCollectionGet
      summary: Read routing violations and their resolution state
      tags: [PATS Exceptions]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/CollectionRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /quality-inspections/resolve:
    get:
      operationId: qualityInspectionResolveGet
      summary: Resolve a scanned batch code into an open quality inspection
      description: Journey D scan-first resolve. Requires quality.resolve. Fail-closed when the gate stage is not in the subject's allowedStages.
      tags: [PATS Quality]
      x-required-capability: quality.resolve
      parameters:
        - name: code
          in: query
          required: true
          schema: { type: string, minLength: 1 }
      responses:
        '200': { $ref: '#/components/responses/ResourceRead' }
        '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }
        '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' }
  /quality-inspections:
    get:
      operationId: qualityInspectionCollectionGet
      summary: Read quality inspections and decisions
      tags: [PATS Quality]
      x-required-capability: quality.read
      responses:
        '200':
          description: Server-owned quality inspections with batch and latest-decision evidence.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/QualityInspection' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' }
  /dashboard-summaries:
    get:
      operationId: dashboardSummaryGet
      summary: Read dashboard counts derived from server ledgers
      tags: [PATS Reporting]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/DashboardRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
  /reports/line:
    get:
      operationId: lineReportGet
      summary: Read the server-owned line reporting projection
      tags: [PATS Reporting]
      x-required-capability: execution.read
      responses: { '200': { $ref: '#/components/responses/LineReportRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '503': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem503' } }
components:
  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
    BatchId: { name: batch_id, in: query, schema: { type: string, minLength: 1 } }
    PlanId: { name: planId, in: path, required: true, schema: { type: string, minLength: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
  responses:
    CollectionRead:
      description: Collection of server-owned resources
      content: { application/json: { schema: { $ref: '#/components/schemas/CollectionEnvelope' } } }
    PaginatedRead:
      description: Paginated collection of server-owned resources
      content: { application/json: { schema: { $ref: '#/components/schemas/PaginatedEnvelope' } } }
    ResourceRead:
      description: Server-owned resource or projection
      content: { application/json: { schema: { type: object } } }
    DashboardRead:
      description: Server-owned dashboard counts derived from operational ledgers
      content: { application/json: { schema: { $ref: '#/components/schemas/DashboardSummary' } } }
    LineReportRead:
      description: Server-owned line activity, throughput evidence, closed-batch, and traceability projection
      content: { application/json: { schema: { $ref: '#/components/schemas/LineReport' } } }
    StationHistoryRead:
      description: Server-owned station event history and open routing violations
      content: { application/json: { schema: { $ref: '#/components/schemas/StationHistory' } } }
  schemas:
    QualityInspection:
      type: object
      required: [id, batchId, stageId, subStageId, stationId, inspectedQuantity, quantityUom, status, startedAt, completedAt, rowVersion, createdAt, updatedAt, decisions, batch]
      properties:
        id: { type: string }
        batchId: { type: string }
        stageId: { type: string }
        subStageId: { type: string, nullable: true }
        stationId: { type: string, nullable: true }
        inspectedQuantity: { type: string, nullable: true }
        quantityUom: { type: string, nullable: true }
        status: { type: string, enum: [OPEN, IN_PROGRESS, COMPLETED, CANCELLED] }
        evidence: { type: object, nullable: true, additionalProperties: true }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
        rowVersion: { type: integer, minimum: 1 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        decisions:
          type: array
          items: { $ref: '#/components/schemas/QualityDecision' }
        batch: { $ref: '#/components/schemas/QualityBatch' }
    QualityDecision:
      type: object
      required: [id, decision, reasonCode, reasonNote, decidedAt]
      properties:
        id: { type: string }
        decision: { type: string, enum: [PASSED, FAILED, HOLD] }
        reasonCode: { type: string, nullable: true }
        reasonNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time }
    QualityBatch:
      type: object
      required: [id, batchCode, lotId, plannedQuantity, parts]
      properties:
        id: { type: string }
        batchCode: { type: string }
        lotId: { type: string }
        plannedQuantity: { type: integer, minimum: 0 }
        parts:
          type: array
          items: { $ref: '#/components/schemas/QualityBatchPart' }
    QualityBatchPart:
      type: object
      required: [partId, quantity, quantityMagnitude, quantityUom, part]
      properties:
        partId: { type: string }
        quantity: { type: integer, minimum: 0 }
        quantityMagnitude: { type: string, nullable: true }
        quantityUom: { type: string, nullable: true }
        part:
          type: object
          required: [id, partCode, partName]
          properties:
            id: { type: string }
            partCode: { type: string }
            partName: { type: string }
    DashboardSummary:
      type: object
      required: [generatedAt, plans, activeProjects, activeLots, activeBatches, openViolations, qualityHolds, inventoryTransactions]
      properties:
        generatedAt: { type: string, format: date-time }
        plans: { type: integer, minimum: 0 }
        activeProjects: { type: integer, minimum: 0 }
        activeLots: { type: integer, minimum: 0 }
        activeBatches: { type: integer, minimum: 0 }
        openViolations: { type: integer, minimum: 0 }
        qualityHolds: { type: integer, minimum: 0 }
        inventoryTransactions: { type: integer, minimum: 0 }
        productionProgress:
          type: array
          items:
            type: object
            required: [projectId, projectName, productName, plannedQuantity, activeQuantity, activeBatchCount, segments]
            properties:
              projectId: { type: string }
              projectName: { type: string }
              productName: { type: string }
              plannedQuantity: { type: number, minimum: 0 }
              activeQuantity: { type: number, minimum: 0 }
              activeBatchCount: { type: integer, minimum: 0 }
              segments:
                type: array
                items:
                  type: object
                  required: [kind, stageId, stageName, quantity]
              properties:
                kind: { type: string, enum: [stage, blocked, remaining] }
                stageId: { type: string }
                stageName: { type: string }
                quantity: { type: number, minimum: 0 }
    LineReport:
      type: object
      required: [generatedAt, production, exceptions, quality, traceability, dailyThroughput, activity, closedLots, routingViolations, inventoryTransactions]
      properties:
        generatedAt: { type: string, format: date-time }
        production: { type: object, required: [plans, batches, acceptedStageEvents], properties: { plans: { type: integer, minimum: 0 }, batches: { type: integer, minimum: 0 }, acceptedStageEvents: { type: integer, minimum: 0 } } }
        exceptions: { type: object, required: [routingViolations], properties: { routingViolations: { type: integer, minimum: 0 } } }
        quality: { type: object, required: [decisions], properties: { decisions: { type: integer, minimum: 0 } } }
        traceability: { type: object, required: [inventoryTransactions], properties: { inventoryTransactions: { type: integer, minimum: 0 } } }
        dailyThroughput:
          type: array
          items: { type: object, required: [date, actual], properties: { date: { type: string, format: date }, expected: { type: number, nullable: true }, actual: { type: number, minimum: 0 } } }
        activity:
          type: array
          items: { type: object, required: [id, occurredAt, stepName, batchId, actor, eventType, isRoutingViolation], properties: { id: { type: string }, occurredAt: { type: string, format: date-time }, stepName: { type: string }, batchId: { type: string }, actor: { type: string }, eventType: { type: string }, isRoutingViolation: { type: boolean } } }
        closedLots:
          type: array
          items: { type: object, required: [id, closedAt, finalStage, qty, result, exception], properties: { id: { type: string }, closedAt: { type: string, format: date-time, nullable: true }, finalStage: { type: string }, qty: { type: string }, result: { type: string, enum: [Closed, Held, Scrapped] }, exception: { type: string } } }
        routingViolations:
          type: array
          items: { type: object, required: [routingViolationId, partId, partCode, partName, batchId, lotId, lotCode, attemptedStageName, expectedStageNames, detectedAt, resolved], properties: { routingViolationId: { type: string }, partId: { type: string }, partCode: { type: string }, partName: { type: string }, batchId: { type: string }, lotId: { type: string }, lotCode: { type: string }, attemptedStageName: { type: string }, expectedStageNames: { type: array, items: { type: string } }, detectedAt: { type: string, format: date-time }, resolved: { type: boolean } } }
        inventoryTransactions:
          type: array
          items: { type: object, required: [inventoryTransactionId, transactionType, partCode, partName, lotCode, batchId, fromStageName, toStageName, expectedQuantity, actualQuantity, variancePercent, exceedsVarianceThreshold, recordedAt, recordedBy], properties: { inventoryTransactionId: { type: string }, transactionType: { type: string, enum: [Receiving, Issuance] }, partCode: { type: string }, partName: { type: string }, lotCode: { type: string }, batchId: { type: string }, fromStageName: { type: string, nullable: true }, toStageName: { type: string }, expectedQuantity: { type: integer, minimum: 0 }, actualQuantity: { type: integer, minimum: 0 }, variancePercent: { type: number }, exceedsVarianceThreshold: { type: boolean }, withdrawalFormRef: { type: string, nullable: true }, recordedAt: { type: string, format: date-time }, recordedBy: { type: string } } }
    StationHistory:
      type: object
      required: [station, events, openViolations]
      properties:
        station:
          type: object
          required: [id, stationCode, name, stageId]
          properties:
            id: { type: string }
            stationCode: { type: string, nullable: true }
            name: { type: string }
            stageId: { type: string }
        events:
          type: array
          items:
            type: object
            required: [id, occurredAt, batchId, batchCode, stageId, subStageId, stepName, actor, eventType, isRoutingViolation, status]
            properties:
              id: { type: string }
              occurredAt: { type: string, format: date-time }
              batchId: { type: string }
              batchCode: { type: string }
              stageId: { type: string }
              subStageId: { type: string, nullable: true }
              stepName: { type: string }
              actor: { type: string }
              eventType: { type: string }
              isRoutingViolation: { type: boolean }
              status: { type: string }
        openViolations:
          type: array
          items:
            type: object
            required: [routingViolationId, batchId, batchCode, lotId, lotCode, partId, partCode, partName, attemptedStep, detectedAt, resolved]
            properties:
              routingViolationId: { type: string }
              batchId: { type: string }
              batchCode: { type: string }
              lotId: { type: string }
              lotCode: { type: string }
              partId: { type: string }
              partCode: { type: string }
              partName: { type: string }
              attemptedStep:
                type: object
                required: [stageId, subStageId, stepName]
                properties:
                  stageId: { type: string }
                  subStageId: { type: string, nullable: true }
                  stepName: { type: string }
              detectedAt: { type: string, format: date-time }
              resolved: { type: boolean }
    CollectionEnvelope:
      type: object
      required: [data]
      properties: { data: { type: array, items: {} } }
    PaginatedEnvelope:
      type: object
      required: [data, pagination]
      properties:
        data: { type: array, items: {} }
        pagination:
          type: object
          required: [page, pageSize, totalItems, totalPages]
          properties:
            page: { type: integer }
            pageSize: { type: integer }
            totalItems: { type: integer }
            totalPages: { type: integer }
