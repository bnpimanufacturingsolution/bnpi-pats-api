openapi: 3.1.0
info:
  title: Bandai PATS API v1 Operational Command Contracts
  version: 2026-07-31
  description: Retry-safe commands for planning, execution, inventory, quality, and exception resolution.
servers:
  - url: /api/v1
paths:
  /stages:
    post:
      operationId: stageCreate
      summary: Add a configured production stage
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' } }
  /sub-stages:
    post:
      operationId: subStageCreate
      summary: Add a configured production substage
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' } }
  /sections:
    post:
      operationId: sectionCreate
      summary: Add a configured section
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' } }
  /station-steps:
    post:
      operationId: stationStepCreate
      summary: Bind a station to an explicit stage step
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' } }
  /work-instructions:
    post:
      operationId: workInstructionCreate
      summary: Add a versioned work instruction
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' } }
  /lines:
    post:
      operationId: lineCreate
      summary: Register a station-screen line under a leaf work process
      description: >
        1 line = 1 station screen (L-1). The line must attach to a leaf WorkProcess; parent
        counts roll up (L-2/L-4). assignedLeaderId is required at creation time (L-5); the
        active leader defaults to the assigned leader. lineCode must be uppercase
        alphanumeric with dashes (e.g. DEC-LS-01) and is unique across the deployment.
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/CommandRead' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }
        '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }
        '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' }
  /lines/{lineId}:
    patch:
      operationId: linePatch
      summary: Update a line (label, code, leaders, order, enable state)
      description: >
        Admin management of the line identity. The cover flip (sick-day active leader) is a
        patch of activeLeaderId; the assigned leader assignment stays untouched (L-5).
        Requires If-Match with the current rowVersion; 412 on mismatch.
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/CommandRead' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }
        '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }
        '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' }
        '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' }
    delete:
      operationId: lineDelete
      summary: Soft-disable a line and end its active operator assignments
      description: >
        Soft-hide (standard §6): the line row is disabled and its ACTIVE operator
        assignments end; GET /lines no longer returns it and reads of attention return 404.
        Evidence stays in audit. Requires If-Match.
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters:
        - name: lineId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IfMatch' }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/CommandRead' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }
        '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }
        '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' }
  /production-lines:
    post:
      operationId: productionLineCreate
      summary: Create a production-line umbrella for the Section tree
      description: >
        A ProductionLine owns Sections; multiple Sections may belong to one line. The created
        line has no Stations yet. Line codes are unique within the deployment.
      tags: [PATS Configuration]
      x-required-capability: operations.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/CommandRead' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }
        '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' }
  /operator-assignments:
    post:
      operationId: operatorAssignmentCreate
      summary: Assign an operator to a line (single-line invariant)
      description: >
        Leader-owned transfer (L-8): the line's active leader (or an admin) assigns an
        ACTIVE operator. A subject already holding an ACTIVE assignment on another line
        returns 409 until that assignment ends. The reason is a plain stamp, not a
        charge-code system.
      tags: [PATS Configuration]
      x-required-capability: execution.write
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses:
        '201': { $ref: '#/components/responses/CommandRead' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }
        '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }
        '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' }
  /operator-assignments/{assignmentId}:
    delete:
      operationId: operatorAssignmentEnd
      summary: End an operator's line assignment
      description: >
        Marks the assignment ENDED with endedAt evidence; rows are never rewritten beyond
        ending. Only the line's active leader or an admin may end it.
      tags: [PATS Configuration]
      x-required-capability: execution.write
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - { $ref: '#/components/parameters/IdempotencyKey' }
      responses:
        '200': { $ref: '#/components/responses/CommandRead' }
        '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }
        '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }
        '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }
  /projects:
    post:
      operationId: projectCreate
      summary: Create a draft project and its single lot
      description: Creating a project also creates its one lot. Optional lotCode suggestion (unique); the lot name is the project name. Model requirements, batch size, and product pack are set on the draft project view. The lot target derives from the requirements once set.
      tags: [PATS Planning]
      x-required-capability: planning.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /projects/{projectId}:
    patch:
      operationId: projectPatch
      summary: Update a draft project, release it, or complete it
      description: Field edits (name, product) apply to DRAFT only. status=RELEASED releases a draft (mints per-part series batches, activates PLANNED→ACTIVE). status=COMPLETED closes a released project once every batch is terminally dispositioned. Status transitions cannot be combined with field edits.
      tags: [PATS Planning]
      x-required-capability: planning.manage
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/CommandRead' }, '400': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem400' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /projects/{projectId}/model-requirements:
    put:
      operationId: projectModelRequirementsReplace
      summary: Replace the project model quantity requirements
      description: Full replacement of model order quantities. Changing the Model set rebuilds project Part snapshots and route versions from the selected Product Pack; changing quantities for the same Model set preserves Project-scoped part removals and existing routes. DRAFT only, including after the Project-owned Lot exists. Empty set clears all requirements; release remains blocked until at least one valid requirement exists.
      tags: [PATS Planning]
      x-required-capability: planning.manage
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /projects/{projectId}/parts-list-versions:
    post:
      operationId: projectPartsListVersionCreate
      summary: Create an immutable draft parts-list route version
      tags: [PATS Planning]
      x-required-capability: planning.manage
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /projects/{projectId}/parts/{partId}:
    delete:
      operationId: projectPartRemove
      summary: Remove a project part and its route steps while a draft
      description: Project-scoped removal only; the catalog ModelPart is untouched. Draft only; refused once released or when batches reference the part. Restore by re-applying the model requirements.
      tags: [PATS Planning]
      x-required-capability: planning.manage
      parameters: [{ $ref: '#/components/parameters/ProjectId' }, { name: partId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' } }
  /batches:
    post:
      operationId: batchCreate
      summary: Create a planned batch for one project part and its initial position projection (API/tests; UI releases mint automatically)
      description: The batch carries a single required partId from the lot's project; multi-part `parts[]` payloads were removed by the user-approved 2026-09-27 v1 scope extension.
      tags: [PATS Execution]
      x-required-capability: planning.manage
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /stage-events:
    post:
      operationId: stageEventCreate
      summary: Record a forward-only stage event or routing violation
      tags: [PATS Execution]
      x-required-capability: execution.write
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /inventory-transactions:
    post:
      operationId: inventoryTransactionCreate
      summary: Record receiving or issuance evidence
      description: Records inventory movement without a MaterialRequirement link; materialRequirementId is retired and rejected.
      tags: [PATS Inventory]
      x-required-capability: inventory.issue
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /quality-inspections:
    post:
      operationId: qualityInspectionCreate
      summary: Open a quality inspection for a batch
      tags: [PATS Quality]
      x-required-capability: quality.resolve
      parameters: [{ $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
  /quality-inspections/{inspectionId}/decisions:
    post:
      operationId: qualityDecisionCreate
      summary: Record a quality decision and close or hold the inspection
      description: FAILED accepts failureDisposition REWORK or TRUE_NG; the batch becomes HELD (rework/hold), SCRAPPED (True-NG), or CLOSED (PASSED).
      tags: [PATS Quality]
      x-required-capability: quality.resolve
      parameters: [{ name: inspectionId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IfMatch' }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '201': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '412': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem412' } }
  /routing-violations/{violationId}/resolve:
    post:
      operationId: routingViolationResolve
      summary: Resolve a routing violation with an operator note
      tags: [PATS Exceptions]
      x-required-capability: reconciliation.resolve
      parameters: [{ name: violationId, in: path, required: true, schema: { type: string } }, { $ref: '#/components/parameters/IdempotencyKey' }]
      responses: { '200': { $ref: '#/components/responses/CommandRead' }, '403': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem403' }, '404': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem404' }, '409': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem409' }, '422': { $ref: './2026-07-14-pats-api-v1-common-components.yaml#/components/responses/Problem422' } }
components:
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { type: string, minLength: 1 } }
    IdempotencyKey: { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 255 } }
    IfMatch: { name: If-Match, in: header, required: true, schema: { type: string, pattern: '^"[0-9]+"$' } }
  responses:
    CommandRead:
      description: Command result and resource projection
      content: { application/json: { schema: { type: object } } }
